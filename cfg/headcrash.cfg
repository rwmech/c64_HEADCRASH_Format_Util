# headcrash.cfg - linker configuration.
#
# Two things the stock c64.cfg does not do.
#
# First, a second code region. The program's ceiling is $5B00, because that
# is where the sprites sit and the VIC has to be able to read them out of
# bank 1. Everything below that is shared between code, read only data and
# BSS, and it filled up. But $C9D1 to $CFFF is plain RAM that the VIC
# cannot see from this bank and nothing else wants, so CODE2 is linked to
# run there. It is stored in the file immediately after the rest of the
# program, so the PRG stays compact, and startup copies it up to $C9D1
# before anything in it is called. Cold code goes there: the splash and the
# scaled text routine behind it run once and are never touched again.
#
# Second, BSS gets a fixed size rather than one worked out by subtraction.
# The stock configuration sizes it as __HIMEM__ - __STACKSIZE__ - the end
# of everything else, and when the program outgrows that the subtraction
# goes negative, wraps, and the linker reports nothing at all. A build that
# had quietly put BSS three bytes past the sprites and started the C stack
# inside it linked without a word of complaint and drew garbage on a real
# machine. Overrunning this area is now a link error.
#
# (C) 2026 Robert Mech. Licence MIT.

FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0400;
    __HIMEM__:     type = weak, value = $5B00;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002,           size = $001A;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = __HIMEM__ - __STACKSIZE__ - __HEADER_LAST__;
    HIGHRAM:  file = "", define = yes, start = $C9D1,           size = $062F;
    BSS:      file = "",               start = __ONCE_RUN__,    size = __HIMEM__ - __STACKSIZE__ - __ONCE_RUN__;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro,  optional = yes;
    CODE:     load = MAIN,     type = ro;
    CODE2:    load = MAIN,     run  = HIGHRAM, type = ro, define = yes, optional = yes;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    INIT:     load = MAIN,     type = rw;
    ONCE:     load = MAIN,     type = ro,  define   = yes;
    BSS:      load = BSS,      type = bss, define   = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
